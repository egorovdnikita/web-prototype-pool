# Публикация прототипа на GitHub Pages: сборка на каждый пуш в main.
# Адреса разделов настоящие, поэтому рядом с index.html кладём его копию
# под именем 404.html — Pages отдаёт её на неизвестный путь, приложение
# загружается и роутер сам разбирает адрес.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
        env:
          BASE_PATH: /promminer-pool/
          # Адрес прокси для чата и щеколда к нему. Пока переменных нет,
          # сборка выходит без модели — чат разбирает запросы локально.
          # Заводятся в Settings → Secrets and variables → Actions.
          VITE_AI_URL: ${{ vars.AI_URL }}
          VITE_AI_TOKEN: ${{ secrets.AI_TOKEN }}
      - run: cp dist/index.html dist/404.html
      # enablement включает Pages в репозитории сам — иначе первый запуск
      # падает на «Get Pages site failed», пока настройку не щёлкнут руками
      - uses: actions/configure-pages@v5
        with:
          enablement: true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
